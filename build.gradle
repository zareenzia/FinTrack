plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.example'
version = '0.0.1-SNAPSHOT'
description = 'finzin'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.postgresql:postgresql'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    implementation 'io.jsonwebtoken:jjwt-impl:0.12.3'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.12.3'
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'org.apache.poi:poi-ooxml:5.2.5'
    implementation 'org.apache.pdfbox:pdfbox:3.0.2'
    implementation 'net.sourceforge.tess4j:tess4j:5.11.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Spring Boot 4.x split the old monolithic spring-boot-test-autoconfigure module (which used
    // to carry every @...Test slice annotation) into one module per technology — spring-boot-starter-test
    // alone no longer provides @WebMvcTest or @DataJpaTest/TestEntityManager/@AutoConfigureTestDatabase,
    // matching how spring-boot-starter-web/spring-boot-starter-data-jpa are the main-code deps in use here.
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    // Testcontainers 2.x has so far only bumped the core `testcontainers` artifact (transitively
    // pulled in above at 2.0.5 by Spring Boot 4.1.0's own dependency management) — the accessory
    // modules below have no 2.x release yet and only exist up to 1.21.4, so core is pinned down to
    // match them here rather than leaving it on a mismatched 2.x/1.x mix.
    testImplementation 'org.testcontainers:testcontainers:1.21.4'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
    testImplementation 'org.testcontainers:postgresql:1.21.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}


// Cache-busting for static assets: after resources are copied into the build output, hash every
// CSS/JS file's *content* and rewrite each HTML file's <link href="..."> / <script src="..."> that
// points at it to append a "?v=<hash>" query string. Because the hash is derived from the file's
// bytes, it only changes when the file's content actually changes on a given deploy — so browsers
// can safely cache "/css/style.css?v=<hash>" forever (see WebConfig's immutable Cache-Control for
// /css/**, /js/**, /images/**) while always re-fetching the HTML itself (short/no-cache, also in
// WebConfig) to discover the current hash. This removes any need for a manual hard refresh after
// a deploy, and requires no manual version bumping — every build recomputes hashes automatically.
task versionStaticAssets {
    group = 'build'
    description = 'Injects a content-hash ?v= query param into CSS/JS references inside the built static HTML for cache-busting.'
    // Always re-run: it rewrites files Gradle just copied via processResources, so relying on
    // input/output-directory up-to-date tracking on that same directory would be unreliable.
    outputs.upToDateWhen { false }

    doLast {
        def staticDir = layout.buildDirectory.dir('resources/main/static').get().asFile
        if (!staticDir.exists()) {
            return
        }

        def hashes = [:]
        ['css', 'js', 'images'].each { sub ->
            def folder = new File(staticDir, sub)
            if (folder.exists()) {
                folder.listFiles({ f -> f.isFile() && (f.name.endsWith('.css') || f.name.endsWith('.js')) } as FileFilter)?.each { f ->
                    def digest = java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes)
                    def hex = digest.collect { b -> String.format('%02x', b) }.join().substring(0, 10)
                    hashes["/$sub/${f.name}"] = hex
                }
            }
        }
        if (hashes.isEmpty()) {
            return
        }

        staticDir.listFiles({ f -> f.isFile() && f.name.endsWith('.html') } as FileFilter)?.each { html ->
            def content = html.getText('UTF-8')
            def updated = content
            hashes.each { relPath, hash ->
                def quoted = java.util.regex.Pattern.quote(relPath)
                // Only replace the exact attribute value (href="/css/style.css" or
                // src="/js/app.js"), not arbitrary substring matches elsewhere in the page.
                updated = updated.replaceAll('(?<=["\'])' + quoted + '(?=["\'])', relPath + '?v=' + hash)
            }
            if (updated != content) {
                html.setText(updated, 'UTF-8')
            }
        }
    }
}
processResources.finalizedBy(versionStaticAssets)

task downloadTessdata {
    def tessdataDir = file('tessdata')
    def dest = file('tessdata/eng.traineddata')

    def minValidBytes = 1_000_000L

    outputs.file(dest)

    doLast {
        if (dest.exists() && dest.length() >= minValidBytes) {
            return
        }
        tessdataDir.mkdirs()
        def tmp = new File(tessdataDir, 'eng.traineddata.tmp')
        try {
            def connection = new URL('https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata').openConnection()
            connection.connectTimeout = 15000
            connection.readTimeout = 60000
            connection.inputStream.withStream { input -> tmp.withOutputStream { output -> output << input } }
            if (tmp.length() < minValidBytes) {
                throw new GradleException("download looked incomplete (${tmp.length()} bytes)")
            }
            java.nio.file.Files.move(tmp.toPath(), dest.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            logger.lifecycle("Downloaded Tesseract eng.traineddata (${dest.length()} bytes) to ${dest}")
        } catch (Exception e) {
            tmp.delete()
            logger.warn("Could not download Tesseract eng.traineddata — Receipt Scanner OCR will stay disabled until this succeeds. Reason: ${e.message}")
        }
    }
}
compileJava.dependsOn downloadTessdata
