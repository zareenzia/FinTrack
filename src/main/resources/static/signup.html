<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TakaFlow - Sign Up</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/images/logo.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --ink: #12190d;
            --ink-2: #1a2513;
            --ink-3: #212f18;
            --accent: #255F38;
            --accent-bright: #34a35a;
            --text-hi: #f5f5f0;
            --text-mid: rgba(245, 245, 240, 0.66);
            --text-low: rgba(245, 245, 240, 0.4);
            --border-soft: rgba(245, 245, 240, 0.09);
            --danger: #e5615c;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: var(--text-hi);
            position: relative;
        }

        /* One soft ambient glow — no grain, no diagonal banding */
        body::before {
            content: '';
            position: fixed;
            width: 900px;
            height: 900px;
            background: radial-gradient(circle, rgba(37, 95, 56, 0.16) 0%, transparent 60%);
            top: -320px;
            left: -260px;
            pointer-events: none;
            z-index: 0;
        }

        .auth-shell {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 1fr 1.05fr;
            background: var(--ink);
            border: 1px solid var(--border-soft);
            border-radius: 22px;
            box-shadow: 0 30px 80px -24px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            min-height: 660px;
        }

        /* ── Left / visual panel ─────────────────────────────────────── */
        .panel-visual {
            background: linear-gradient(165deg, var(--ink-2) 0%, var(--ink) 100%);
            padding: 40px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .brand-mark {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.01em;
            z-index: 1;
        }

        .brand-mark img {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            object-fit: contain;
        }

        .portfolio-chart {
            z-index: 1;
            padding: 20px 0 26px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .portfolio-chart .chart-label {
            font-size: 11.5px;
            color: var(--text-low);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 14px;
            font-weight: 600;
        }

        .chart-line { animation: chartDraw 1.5s ease-out forwards; }
        .chart-fill { animation: chartFadeIn 1.5s ease-out 0.3s both; }
        .portfolio-chart circle { animation: chartFadeIn 0.4s ease-out 1.4s both; }

        @keyframes chartDraw {
            from { stroke-dashoffset: 600; }
            to   { stroke-dashoffset: 0; }
        }

        @keyframes chartFadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .stats-box {
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            background: rgba(245, 245, 240, 0.03);
            border-radius: 14px;
            border: 1px solid var(--border-soft);
        }

        .stat-icon {
            font-size: 17px;
            color: var(--accent-bright);
            width: 30px;
            flex-shrink: 0;
        }

        .stat-content {
            flex: 1;
        }

        .stat-label {
            font-size: 11.5px;
            color: var(--text-low);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-value {
            font-size: 14.5px;
            color: var(--text-hi);
            font-weight: 600;
            margin-top: 2px;
        }

        .stat-change {
            font-size: 12.5px;
            color: var(--accent-bright);
            margin-left: auto;
            font-weight: 600;
        }

        @keyframes statSlideUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .stat-item:nth-child(1) { animation: statSlideUp 0.5s ease-out 1.6s both; }
        .stat-item:nth-child(2) { animation: statSlideUp 0.5s ease-out 1.7s both; }

        /* ── Right / form panel ───────────────────────────────────────── */
        .panel-form {
            background: var(--ink);
            padding: 44px 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-shell {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }

        .kicker {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            color: var(--accent-bright);
            margin-bottom: 10px;
        }

        .heading {
            font-size: 27px;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.15;
            margin-bottom: 26px;
        }

        .tab-track {
            display: flex;
            gap: 4px;
            padding: 4px;
            background: var(--ink-3);
            border-radius: 999px;
            margin-bottom: 26px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 0;
            background: transparent;
            border: none;
            color: var(--text-mid);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            border-radius: 999px;
        }

        .tab-btn.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 6px 16px -4px rgba(37, 95, 56, 0.55);
        }

        .tab-btn:hover:not(.active) {
            color: var(--text-hi);
        }

        .tab-btn:active {
            transform: scale(0.97);
        }

        .form-wrapper {
            position: relative;
        }

        .form-section {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            opacity: 1;
            transition: opacity 0.3s ease, visibility 0.3s ease, transform 0.3s ease;
            visibility: visible;
            transform: translateX(0);
        }

        .form-section.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateX(8px);
        }

        .notification {
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 13px;
            display: none;
            line-height: 1.5;
        }

        .notification.success {
            background: rgba(37, 95, 56, 0.14);
            color: #5fd68a;
            border: 1px solid rgba(37, 95, 56, 0.35);
            display: block;
        }

        .notification.error {
            background: rgba(229, 97, 92, 0.1);
            color: var(--danger);
            border: 1px solid rgba(229, 97, 92, 0.3);
            display: block;
        }

        .form-row {
            display: flex;
            gap: 14px;
        }

        .form-row .form-group {
            flex: 1;
            min-width: 0;
        }

        .form-group {
            margin-bottom: 15px;
            position: relative;
        }

        label {
            display: block;
            color: var(--text-mid);
            font-size: 11px;
            margin-bottom: 7px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 11.5px 14px;
            background: rgba(245, 245, 240, 0.04);
            border: 1px solid var(--border-soft);
            border-radius: 10px;
            color: var(--text-hi);
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        input::placeholder {
            color: var(--text-low);
        }

        input:focus {
            outline: none;
            background: rgba(245, 245, 240, 0.05);
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 95, 56, 0.22);
        }

        input.error {
            border-color: var(--danger);
        }

        input.success {
            border-color: var(--accent);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 16px 0 22px 0;
        }

        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--accent);
            flex-shrink: 0;
        }

        .checkbox-group label {
            margin: 0;
            color: var(--text-mid);
            font-size: 12.5px;
            text-transform: none;
            letter-spacing: normal;
            font-weight: 400;
            cursor: pointer;
        }

        .checkbox-group a {
            color: var(--accent-bright);
            text-decoration: none;
        }

        .checkbox-group a:hover {
            text-decoration: underline;
        }

        button.btn-submit {
            width: 100%;
            padding: 13px 22px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button.btn-submit:hover {
            background: var(--accent-bright);
            box-shadow: 0 10px 24px -6px rgba(37, 95, 56, 0.5);
        }

        button.btn-submit:active {
            transform: scale(0.98);
        }

        .footer-link {
            text-align: center;
            margin-top: 18px;
            color: var(--text-mid);
            font-size: 12.5px;
        }

        .footer-link a {
            color: var(--accent-bright);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }

        @keyframes notifSlideDown {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .notification.success,
        .notification.error {
            animation: notifSlideDown 0.25s ease-out forwards;
        }

        @media (max-width: 900px) {
            .auth-shell {
                grid-template-columns: 1fr;
                min-height: 100dvh;
                border-radius: 0;
                max-width: 100%;
                border: none;
            }

            .panel-visual {
                display: none;
            }

            .panel-form {
                padding: 32px 24px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 0;
                align-items: flex-start;
            }

            .panel-form {
                min-height: 100dvh;
                justify-content: center;
                padding: 40px 20px;
            }

            .form-wrapper {
                min-height: 540px;
            }

            .heading {
                font-size: 22px;
                margin-bottom: 20px;
            }

            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>
    <div class="auth-shell">
        <!-- Left / visual panel -->
        <div class="panel-visual">
            <div class="brand-mark">
                <img src="/images/logo.png" alt="TakaFlow">TakaFlow
            </div>

            <!-- Net worth trend chart -->
            <div class="portfolio-chart" aria-hidden="true">
                <div class="chart-label">Net Worth, Last 6 Months</div>
                <svg viewBox="0 0 260 80" xmlns="http://www.w3.org/2000/svg" style="width:100%;overflow:visible;">
                    <defs>
                        <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#255F38" stop-opacity="0.35"/>
                            <stop offset="100%" stop-color="#255F38" stop-opacity="0"/>
                        </linearGradient>
                        <clipPath id="chartClip">
                            <rect x="0" y="0" width="260" height="80"/>
                        </clipPath>
                    </defs>
                    <path class="chart-fill" d="M0,60 L30,52 L60,45 L90,48 L120,35 L150,28 L180,22 L210,15 L240,10 L260,8 L260,80 L0,80 Z"
                          fill="url(#chartGrad)" clip-path="url(#chartClip)" opacity="0"/>
                    <path class="chart-line" d="M0,60 L30,52 L60,45 L90,48 L120,35 L150,28 L180,22 L210,15 L240,10 L260,8"
                          fill="none" stroke="#255F38" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                          stroke-dasharray="600" stroke-dashoffset="600"/>
                    <circle cx="260" cy="8" r="4" fill="#1F7D53" opacity="0"/>
                </svg>
            </div>

            <div class="stats-box">
                <div class="stat-item">
                    <div class="stat-icon">
                        <i class="fas fa-piggy-bank"></i>
                    </div>
                    <div class="stat-content">
                        <div class="stat-label">Savings Rate</div>
                        <div class="stat-value">32% of income</div>
                    </div>
                    <div class="stat-change">+4.1%</div>
                </div>

                <div class="stat-item">
                    <div class="stat-icon">
                        <i class="fas fa-trophy"></i>
                    </div>
                    <div class="stat-content">
                        <div class="stat-label">Budgets On Track</div>
                        <div class="stat-value">4 of 5 categories</div>
                    </div>
                    <div class="stat-change">+3.2%</div>
                </div>
            </div>
        </div>

        <!-- Right / form panel -->
        <div class="panel-form">
            <div class="form-shell">
                <p class="kicker">Personal finance, simplified</p>
                <div class="heading">Welcome to TakaFlow</div>

                <div class="tab-track">
                    <button class="tab-btn active" id="login-tab" onclick="switchTab('login')">Login</button>
                    <button class="tab-btn" id="signup-tab" onclick="switchTab('signup')">Sign Up</button>
                </div>

                <div class="form-wrapper">
                    <!-- Login Form -->
                    <div id="login-form" class="form-section">
                        <div id="login-notification" class="notification"></div>

                        <div class="form-group">
                            <label>Email or Username</label>
                            <input type="text" id="login-username" placeholder="Enter your email or username">
                        </div>

                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" id="login-password" placeholder="Enter your password">
                        </div>

                        <div class="checkbox-group">
                            <input type="checkbox" id="remember-me">
                            <label for="remember-me">Remember me</label>
                        </div>

                        <button class="btn-submit" onclick="handleLogin()">Login</button>

                        <div class="footer-link">
                            Don't have an account? <a onclick="switchTab('signup'); return false;">Sign Up</a>
                        </div>
                    </div>

                    <!-- Sign Up Form -->
                    <div id="signup-form" class="form-section hidden">
                        <div id="signup-notification" class="notification"></div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Full Name</label>
                                <input type="text" id="signup-fullname" placeholder="Enter your full name">
                            </div>

                            <div class="form-group">
                                <label>Username</label>
                                <input type="text" id="signup-username" placeholder="Choose a username">
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="signup-email" placeholder="Enter your email address">
                        </div>

                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" id="signup-password" placeholder="Create a strong password">
                            <div id="pwd-strength-bar" style="margin-top:7px;height:4px;border-radius:2px;background:rgba(245,245,240,0.08);overflow:hidden;">
                                <div id="pwd-strength-fill" style="height:100%;width:0%;border-radius:2px;transition:width 0.3s ease,background-color 0.3s ease;"></div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Confirm Password</label>
                            <input type="password" id="signup-confirm-password" placeholder="Confirm your password">
                        </div>

                        <div class="checkbox-group">
                            <input type="checkbox" id="agree-terms">
                            <label for="agree-terms">I agree to the <a href="#">Terms and Conditions</a></label>
                        </div>

                        <button class="btn-submit" onclick="handleSignup()">Sign Up</button>

                        <div class="footer-link">
                            Already have an account? <a onclick="switchTab('login'); return false;">Login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const loginTab = document.getElementById('login-tab');
            const signupTab = document.getElementById('signup-tab');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                loginTab.classList.add('active');
                signupTab.classList.remove('active');
            } else {
                signupForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                signupTab.classList.add('active');
                loginTab.classList.remove('active');
            }
            clearForm();
        }

        function clearForm() {
            document.querySelectorAll('input[type="text"], input[type="email"], input[type="password"]').forEach(input => {
                input.value = '';
                input.classList.remove('success', 'error');
            });
            document.querySelectorAll('.notification').forEach(notif => {
                notif.classList.remove('success', 'error');
                notif.textContent = '';
            });
        }

        async function handleLogin() {
            const usernameOrEmail = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            const notification = document.getElementById('login-notification');

            if (!usernameOrEmail || !password) {
                showNotification(notification, 'Please fill in all fields', 'error');
                return;
            }

            const _loginBtn = document.querySelector('#login-form .btn-submit');
            const _loginBtnText = _loginBtn.textContent;
            _loginBtn.disabled = true;
            _loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right:6px;"></i>Logging in...';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usernameOrEmail, password })
                });

                const data = await response.json();

                if (response.ok) {
                    if (data.token) localStorage.setItem('token', data.token);
                    if (data.user) localStorage.setItem('user', JSON.stringify(data.user));
                    showNotification(notification, '✅ Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 1000);
                } else {
                    showNotification(notification, data.error || 'Login failed', 'error');
                }
            } catch (error) {
                showNotification(notification, 'Connection error', 'error');
            } finally {
                _loginBtn.disabled = false;
                _loginBtn.textContent = _loginBtnText;
            }
        }

        async function handleSignup() {
            const fullName = document.getElementById('signup-fullname').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const username = document.getElementById('signup-username').value.trim();
            const password = document.getElementById('signup-password').value;
            const confirmPassword = document.getElementById('signup-confirm-password').value;
            const agreeTerms = document.getElementById('agree-terms').checked;
            const notification = document.getElementById('signup-notification');

            if (!fullName || !email || !username || !password || !confirmPassword) {
                showNotification(notification, 'Please fill in all fields', 'error');
                return;
            }

            if (password !== confirmPassword) {
                showNotification(notification, 'Passwords do not match', 'error');
                return;
            }

            if (!agreeTerms) {
                showNotification(notification, 'Please agree to the terms', 'error');
                return;
            }

            const _signupBtn = document.querySelector('#signup-form .btn-submit');
            const _signupBtnText = _signupBtn.textContent;
            _signupBtn.disabled = true;
            _signupBtn.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right:6px;"></i>Signing up...';

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, username, email, password, confirmPassword })
                });

                const data = await response.json();

                if (response.ok) {
                    if (data.token) localStorage.setItem('token', data.token);
                    if (data.user) localStorage.setItem('user', JSON.stringify(data.user));
                    showNotification(notification, '✅ Registration successful! Please check your email to verify your account. Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 1800);
                } else {
                    showNotification(notification, data.error || 'Registration failed', 'error');
                }
            } catch (error) {
                showNotification(notification, 'Connection error', 'error');
            } finally {
                _signupBtn.disabled = false;
                _signupBtn.textContent = _signupBtnText;
            }
        }

        function showNotification(element, message, type) {
            element.textContent = message;
            element.classList.remove('success', 'error');
            element.classList.add(type);
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('input[type="email"], input[type="text"], input[type="password"]').forEach(input => {
                input.addEventListener('blur', validateInput);
                input.addEventListener('focus', function() {
                    this.classList.remove('success', 'error');
                    const icon = this.parentElement.querySelector('.input-icon');
                    if (icon) icon.classList.remove('success', 'error');
                });
            });
        });

        function validateInput(e) {
            const input = e.target;
            const icon = input.parentElement.querySelector('.input-icon');
            const value = input.value.trim();

            if (!value) {
                input.classList.remove('success', 'error');
                if (icon) icon.classList.remove('success', 'error');
                return;
            }

            if (input.type === 'email') {
                const isValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
                if (isValid) {
                    input.classList.add('success');
                    if (icon) icon.classList.add('success');
                } else {
                    input.classList.add('error');
                    if (icon) icon.classList.add('error');
                }
            } else if (input.id.includes('password')) {
                if (value.length >= 6) {
                    input.classList.add('success');
                    if (icon) icon.classList.add('success');
                } else {
                    input.classList.add('error');
                    if (icon) icon.classList.add('error');
                }
            } else {
                input.classList.add('success');
                if (icon) icon.classList.add('success');
            }
        }

        function checkPasswordStrength(password) {
            let score = 0;
            if (password.length >= 6) score++;
            if (password.length >= 10) score++;
            if (/[A-Z]/.test(password)) score++;
            if (/[0-9]/.test(password)) score++;
            if (/[^A-Za-z0-9]/.test(password)) score++;
            const fill = document.getElementById('pwd-strength-fill');
            if (!fill) return;
            const widths = [0, 20, 40, 60, 80, 100];
            const colors = ['', '#ef4444', '#f97316', '#f59e0b', '#84cc16', '#22c55e'];
            fill.style.width = widths[Math.min(score, 5)] + '%';
            fill.style.backgroundColor = colors[Math.min(score, 5)] || 'transparent';
        }
        document.getElementById('signup-password').addEventListener('input', function() {
            checkPasswordStrength(this.value);
        });
    </script>
</body>
</html>
