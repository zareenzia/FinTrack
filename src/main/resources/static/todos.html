<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do - FinTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/mobile.css">
    <link rel="icon" type="image/png" href="/images/logo.png">
    <style>
        .td-layout {
            display: grid;
            grid-template-columns: 260px 1fr 340px;
            gap: 16px;
            align-items: start;
        }
        .td-layout.td-no-detail { grid-template-columns: 260px 1fr; }
        @media (max-width: 1100px) {
            .td-layout { grid-template-columns: 1fr; }
        }

        .td-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-body);
        }

        /* ── Sidebar: folders + lists ─────────────────────────── */
        .td-sidebar { padding: 12px; max-height: 78vh; overflow-y: auto; }
        .td-sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .td-sidebar-header h6 { margin: 0; font-weight: 700; }
        .td-icon-btn {
            width: 30px; height: 30px; border: none; border-radius: 8px;
            background: transparent; color: var(--text-muted-custom, #888);
            display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .td-icon-btn:hover { background: var(--bg-table-hover, rgba(0,0,0,0.05)); color: var(--text-body); }

        .td-folder { margin-bottom: 4px; }
        .td-folder-header {
            display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 8px;
            cursor: pointer; user-select: none; font-weight: 600; font-size: 0.9rem;
        }
        .td-folder-header:hover { background: var(--bg-table-hover, rgba(0,0,0,0.05)); }
        .td-folder-header.drag-over { background: var(--accent-color); color: #fff; }
        .td-folder-header i.td-chevron { transition: transform 0.15s ease; font-size: 0.75rem; width: 12px; }
        .td-folder.collapsed .td-chevron { transform: rotate(-90deg); }
        .td-folder.collapsed .td-folder-lists { display: none; }
        .td-folder-lists { padding-left: 18px; min-height: 6px; }
        .td-folder-lists.drag-over, .td-standalone-lists.drag-over { background: var(--bg-table-hover, rgba(0,0,0,0.08)); border-radius: 8px; }

        .td-list-row {
            display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px;
            cursor: pointer; font-size: 0.88rem; margin-bottom: 2px;
        }
        .td-list-row:hover { background: var(--bg-table-hover, rgba(0,0,0,0.05)); }
        .td-list-row.active { background: var(--accent-color); color: #fff; }
        .td-list-row .td-list-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .td-list-row .td-list-count { font-size: 0.75rem; opacity: 0.7; }
        .td-list-row.dragging, .td-item-row.dragging, .td-folder.dragging { opacity: 0.5; }
        .td-standalone-lists { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--border-color); }

        /* ── Middle: selected list's items ────────────────────── */
        .td-middle { padding: 16px; min-height: 60vh; }
        .td-middle-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .td-middle-header h5 { margin: 0; }
        .td-quick-add { margin-bottom: 14px; }
        .td-quick-add input {
            width: 100%; border: 1px dashed var(--border-color); border-radius: 8px; padding: 10px 12px;
            background: transparent; color: var(--text-body);
        }
        .td-quick-add input:focus { outline: none; border-color: var(--accent-color); }

        .td-item-row {
            display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px;
            border: 1px solid var(--border-color); margin-bottom: 8px; cursor: pointer; background: var(--bg-input, transparent);
        }
        .td-item-row.selected { border-color: var(--accent-color); }
        .td-item-row.drag-over { background: var(--bg-table-hover, rgba(0,0,0,0.08)); }
        .td-checkbox { width: 20px; height: 20px; flex-shrink: 0; cursor: pointer; }
        .td-item-title { flex: 1; min-width: 0; word-break: break-word; }
        .td-item-row.completed .td-item-title { text-decoration: line-through; opacity: 0.6; }
        .td-item-sub-badge { font-size: 0.72rem; padding: 2px 7px; border-radius: 10px; background: var(--bg-table-hover, rgba(0,0,0,0.08)); }
        .td-star-btn { background: none; border: none; color: #d1d5db; cursor: pointer; font-size: 0.95rem; }
        .td-star-btn.active { color: #f5b400; }
        .td-item-delete { background: none; border: none; color: var(--text-muted-custom, #999); cursor: pointer; }
        .td-item-delete:hover { color: #dc3545; }

        /* ── Right: detail panel ──────────────────────────────── */
        .td-detail-panel { padding: 16px; max-height: 78vh; overflow-y: auto; }
        .td-detail-title {
            width: 100%; border: none; background: transparent; font-size: 1.1rem; font-weight: 700;
            color: var(--text-body); margin-bottom: 10px; padding: 4px 0;
        }
        .td-detail-title:focus { outline: none; border-bottom: 1px solid var(--accent-color); }
        .td-detail-row { margin-bottom: 14px; }
        .td-detail-row label { font-size: 0.78rem; font-weight: 600; color: var(--text-muted-custom, #888); display: block; margin-bottom: 4px; }
        .td-detail-notes {
            width: 100%; border: 1px solid var(--border-color); border-radius: 8px; padding: 8px;
            background: transparent; color: var(--text-body); resize: vertical; min-height: 70px;
        }
        .td-substep-row {
            display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-radius: 6px;
        }
        .td-substep-row.drag-over { background: var(--bg-table-hover, rgba(0,0,0,0.08)); }
        .td-substep-title { flex: 1; font-size: 0.88rem; }
        .td-substep-row.completed .td-substep-title { text-decoration: line-through; opacity: 0.6; }
        .td-add-step-input {
            width: 100%; border: dashed 1px var(--border-color); border-radius: 6px; padding: 6px 8px;
            background: transparent; color: var(--text-body); font-size: 0.85rem; margin-top: 4px;
        }
        .td-add-step-input:focus { outline: none; border-color: var(--accent-color); }
        .td-detail-footer { font-size: 0.75rem; color: var(--text-muted-custom, #888); margin-top: 16px; border-top: 1px solid var(--border-color); padding-top: 10px; }

        .td-empty { text-align: center; padding: 40px 16px; color: var(--text-muted-custom, #888); }
        .td-empty i { font-size: 2.4rem; color: #ccc; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>
<div id="toastContainer" class="notification-toast-container" aria-live="polite" aria-atomic="true"></div>

<div class="container-fluid mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="fas fa-list-check"></i> To-Do</h2>
    </div>

    <div class="td-layout td-no-detail" id="tdLayout">
        <!-- Sidebar: folders + lists -->
        <div class="td-panel td-sidebar">
            <div class="td-sidebar-header">
                <h6>Lists</h6>
                <div>
                    <button class="td-icon-btn" onclick="openCreateFolderModal()" title="New folder"><i class="fas fa-folder-plus"></i></button>
                    <button class="td-icon-btn" onclick="openCreateListModal(null)" title="New list"><i class="fas fa-plus"></i></button>
                </div>
            </div>
            <div id="tdSidebarTree"></div>
        </div>

        <!-- Middle: selected list's items -->
        <div class="td-panel td-middle">
            <div class="td-middle-header">
                <h5 id="tdSelectedListName">Select a list</h5>
            </div>
            <div class="td-quick-add d-none" id="tdQuickAddRow">
                <input type="text" id="tdQuickAddInput" placeholder="+ Add a task" onkeydown="if(event.key==='Enter') window.tdAddQuickTask()">
            </div>
            <div id="tdItemsContainer">
                <div class="td-empty"><i class="fas fa-list-check"></i><p class="mb-0">Pick a list on the left, or create one to get started.</p></div>
            </div>
        </div>

        <!-- Right: item detail panel -->
        <div class="td-panel td-detail-panel d-none" id="tdDetailPanel"></div>
    </div>
</div>

<!-- Create Folder Modal -->
<div class="modal fade" id="tdFolderModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="tdFolderModalTitle">New Folder</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="tdFolderId">
                <input type="text" class="form-control" id="tdFolderName" placeholder="Folder name" onkeydown="if(event.key==='Enter') window.tdSaveFolder()">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="window.tdSaveFolder()">Save</button>
            </div>
        </div>
    </div>
</div>

<!-- Create/Rename List Modal -->
<div class="modal fade" id="tdListModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="tdListModalTitle">New List</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="tdListId">
                <div class="mb-3">
                    <input type="text" class="form-control" id="tdListName" placeholder="List name" onkeydown="if(event.key==='Enter') window.tdSaveList()">
                </div>
                <div>
                    <label class="form-label small fw-bold">Folder (optional)</label>
                    <select class="form-select" id="tdListFolder">
                        <option value="">No folder (standalone)</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="window.tdSaveList()">Save</button>
            </div>
        </div>
    </div>
</div>

<!-- Delete Confirmation Modal (shared for folder/list/item) -->
<div class="modal fade" id="tdDeleteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="tdDeleteModalTitle">Delete</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="tdDeleteModalBody">Are you sure?</div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" onclick="window.tdConfirmDelete()">Yes, Delete</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/todo.js"></script>
<script src="/js/sidebar.js"></script>
</body>
</html>
