spring.application.name=finzin

# Server Configuration
#server.port=${PORT:8585}
server.port=8585

# Spring Security - Suppress auto-generated password log (using JWT instead)
logging.level.org.springframework.boot.autoconfigure.security=ERROR

## Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

# JWT Configuration (must be at least 64 characters for HS512)
app.jwt.secret=${JWT_SECRET}

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging Configuration
logging.level.root=WARN
logging.level.org.springframework.boot=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
app.upload.dir=user-uploads/profiles

# Receipt Scanner
app.receipts.upload.dir=secure-uploads/receipts
tesseract.datapath=${TESSERACT_DATAPATH:tessdata}
tesseract.language=eng
app.receipts.cleanup.enabled=true
app.receipts.retention-hours=48

# Gold Asset Configuration
gold.source.url=https://www.goldr.org/
gold.sync.enabled=true
gold.sync.interval-minutes=1440
gold.sync.timeout-seconds=10

# Email (SMTP) Configuration
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@takaflow.app}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:8585}